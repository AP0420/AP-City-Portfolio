<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AP City 3D — Drive. Explore. Discover My Work.</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Exo 2', sans-serif;
            overflow: hidden;
            color: #fff;
        }
        
        /* Canvas takes full screen */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* UI Overlay - higher z-index */
        .ui-overlay {
            position: fixed;
            z-index: 100;
            pointer-events: none;
        }
        
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(5, 5, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            font-family: 'Orbitron', monospace;
            z-index: 100;
            pointer-events: none;
        }
        
        .ap-badge {
            background: linear-gradient(135deg, #00d4ff, #b04fff);
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 900;
            display: inline-block;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        
        .name {
            font-size: 18px;
            font-weight: 700;
            color: #00d4ff;
            letter-spacing: 2px;
        }
        
        .tagline {
            font-size: 10px;
            color: rgba(0, 212, 255, 0.6);
            letter-spacing: 1px;
            margin-top: 4px;
        }
        
        #controls-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(5, 5, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 11px;
            font-family: 'Orbitron', monospace;
            z-index: 100;
            pointer-events: none;
        }
        
        .controls-key {
            display: inline-block;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 6px;
            padding: 4px 8px;
            margin: 0 2px;
            font-size: 11px;
        }
        
        #building-indicator {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #00ff88;
            border-radius: 12px;
            padding: 12px 24px;
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
        }
        
        #building-indicator.visible {
            opacity: 1;
        }
        
        .building-name {
            color: #00ff88;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        
        .building-hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }
        
        #progress-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(5, 5, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            min-width: 160px;
            text-align: center;
            font-family: 'Orbitron', monospace;
            z-index: 100;
            pointer-events: none;
        }
        
        .progress-label {
            font-size: 9px;
            color: rgba(0, 212, 255, 0.6);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 8px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #b04fff, #ff3da6);
            width: 0%;
            transition: width 0.5s;
            border-radius: 2px;
        }
        
        .progress-text {
            font-size: 10px;
            color: #00d4ff;
        }
        
        #achievement-toast {
            position: fixed;
            bottom: 120px;
            right: 20px;
            background: rgba(5, 5, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #ffb700;
            border-radius: 12px;
            padding: 12px 20px;
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
            min-width: 220px;
            font-family: 'Orbitron', monospace;
            pointer-events: none;
        }
        
        #achievement-toast.show {
            transform: translateX(0);
        }
        
        .ach-title {
            font-size: 9px;
            color: #ffb700;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        
        .ach-name {
            font-size: 12px;
            color: #fff;
        }
        
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        #modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: linear-gradient(145deg, #080818, #0d1228);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 20px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        #modal-overlay.open .modal-content {
            transform: scale(1);
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #fff;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: rgba(255, 0, 0, 0.3);
            border-color: rgba(255, 0, 0, 0.5);
        }
        
        .modal-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 12px;
        }
        
        .modal-title {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 6px;
        }
        
        .modal-subtitle {
            font-size: 11px;
            text-align: center;
            color: rgba(0, 212, 255, 0.6);
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        
        .modal-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            margin: 20px 0;
        }
        
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        
        .sec-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px;
        }
        
        .sec-card h4 {
            font-size: 13px;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        
        .sec-card p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }
        
        .skill-item {
            margin-bottom: 12px;
        }
        
        .skill-name {
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .skill-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .skill-fill {
            height: 100%;
            border-radius: 2px;
            width: 0%;
            transition: width 1s;
        }
        
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 9px;
            border: 1px solid;
            margin: 2px;
        }
        
        .exp-item {
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid;
            border-radius: 0 8px 8px 0;
            margin-bottom: 12px;
        }
        
        .exp-item h4 {
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .exp-item p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .exp-role {
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 12px;
            margin-bottom: 10px;
            outline: none;
        }
        
        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #ff6b35;
        }
        
        .contact-form textarea {
            height: 70px;
            resize: none;
        }
        
        .contact-btn {
            background: linear-gradient(135deg, #ff6b35, #ff3da6);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        
        .dream-item {
            padding: 10px;
            background: rgba(255, 183, 0, 0.05);
            border: 1px solid rgba(255, 183, 0, 0.15);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .dream-item h4 {
            font-size: 12px;
            color: #ffb700;
        }
        
        .dream-item p {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        #loading {
            position: fixed;
            inset: 0;
            background: #050510;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10000;
            font-family: 'Orbitron', monospace;
        }
        
        .loader-text {
            color: #00d4ff;
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 20px;
        }
        
        @media (max-width: 600px) {
            #info { font-size: 10px; padding: 8px 12px; }
            .name { font-size: 14px; }
            #progress-panel { padding: 8px 12px; min-width: 120px; }
            .modal-content { padding: 20px; }
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div style="font-size: 32px; font-weight: 900; background: linear-gradient(135deg,#00d4ff,#b04fff,#ff3da6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AP CITY 3D</div>
        <div class="loader-text">LOADING 3D WORLD...</div>
    </div>
    
    <div id="info">
        <div class="ap-badge">AP</div>
        <div class="name">ARYAN PARMAR</div>
        <div class="tagline">AUTOMATION · OPERATIONS · DIGITAL MARKETING</div>
    </div>
    
    <div id="progress-panel">
        <div class="progress-label">CITY EXPLORED</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0 / 8 BUILDINGS</div>
    </div>
    
    <div id="building-indicator">
        <div class="building-name" id="building-name">BUILDING</div>
        <div class="building-hint">Press E to explore</div>
    </div>
    
    <div id="controls-panel">
        <span class="controls-key">W A S D</span> or 
        <span class="controls-key">← ↑ ↓ →</span> to drive<br>
        <span class="controls-key">E</span> to enter building • 
        <span class="controls-key">ESC</span> to close
    </div>
    
    <div id="achievement-toast">
        <div class="ach-title">🏆 ACHIEVEMENT UNLOCKED</div>
        <div class="ach-name" id="achievement-name">City Explorer!</div>
    </div>
    
    <div id="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">✕</button>
            <div id="modal-inner"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Wait for Three.js to load
        window.addEventListener('load', function() {
            init();
        });
        
        function init() {
            console.log('Initializing AP City 3D...');
            
            // Hide loading screen after a short delay
            setTimeout(() => {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
            }, 800);
            
            // ============ BUILDING DATA ============
            const buildingsData = [
                { id: 'house', label: '🏠 HOUSE', sublabel: 'About Me', pos: { x: -12, z: -18 }, color: 0x00d4ff, section: 'house', achievement: 'Welcome to AP City! 🏠' },
                { id: 'office', label: '🏢 OFFICE', sublabel: 'Experience', pos: { x: 8, z: -16 }, color: 0xb04fff, section: 'office', achievement: 'Clocking In! 🏢' },
                { id: 'garage', label: '🔧 GARAGE', sublabel: 'Skills', pos: { x: -18, z: -2 }, color: 0x00ff88, section: 'garage', achievement: 'My Garage — Powered Up! ⚙️' },
                { id: 'techpark', label: '💻 TECH PARK', sublabel: 'Projects', pos: { x: 10, z: -1 }, color: 0x00ffd4, section: 'techpark', achievement: 'Code Deployed! 💻' },
                { id: 'stadium', label: '🏟️ STADIUM', sublabel: 'Events', pos: { x: -14, z: 12 }, color: 0xff3da6, section: 'stadium', achievement: 'Crowd Goes Wild! 🎤' },
                { id: 'cafe', label: '☕ CAFÉ', sublabel: 'Contact Me', pos: { x: 6, z: 14 }, color: 0xff6b35, section: 'cafe', achievement: "Let's Meet! ☕" },
                { id: 'secret', label: '? HIDDEN', sublabel: 'Achievements', pos: { x: -24, z: -12 }, color: 0xff0055, section: 'secret', achievement: '🕵️ Secret Agent — Found It!' },
                { id: 'dream', label: '🌟 DREAM TOWER', sublabel: 'Future Goals', pos: { x: 16, z: 8 }, color: 0xffb700, section: 'dream', achievement: 'Dreams Are Loading... 🌟' }
            ];
            
            const visitedBuildings = new Set();
            let currentBuilding = null;
            let achievementQueue = [];
            
            // ============ THREE.JS SETUP ============
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.008);
            
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 10);
            camera.lookAt(0, 0, 0);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            console.log('Renderer created');
            
            // ============ LIGHTING ============
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xfff5e0, 1);
            directionalLight.position.set(10, 20, 5);
            directionalLight.castShadow = true;
            directionalLight.receiveShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);
            
            const fillLight = new THREE.PointLight(0x4466ff, 0.4);
            fillLight.position.set(0, 5, 0);
            scene.add(fillLight);
            
            const backLight = new THREE.PointLight(0xffaa66, 0.3);
            backLight.position.set(-5, 3, -8);
            scene.add(backLight);
            
            // ============ GROUND ============
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0a18, roughness: 0.8, metalness: 0.1 });
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Grid helper
            const gridHelper = new THREE.GridHelper(80, 20, 0x00d4ff, 0x334455);
            gridHelper.position.y = -0.05;
            scene.add(gridHelper);
            
            // Road markings
            const markerMat = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0xff4400, emissiveIntensity: 0.2 });
            for (let i = -30; i <= 30; i += 5) {
                const marker = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), markerMat);
                marker.position.set(i, -0.08, 0);
                scene.add(marker);
                
                const marker2 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), markerMat);
                marker2.position.set(0, -0.08, i);
                scene.add(marker2);
            }
            
            // ============ TREES ============
            function createTree(x, z) {
                const group = new THREE.Group();
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4c3b });
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1, 6), trunkMat);
                trunk.position.y = 0.5;
                trunk.castShadow = true;
                group.add(trunk);
                
                const foliageMat = new THREE.MeshStandardMaterial({ color: 0x3a8c3a });
                const foliage1 = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1, 8), foliageMat);
                foliage1.position.y = 1.1;
                foliage1.castShadow = true;
                group.add(foliage1);
                
                const foliage2 = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.9, 8), foliageMat);
                foliage2.position.y = 1.8;
                foliage2.castShadow = true;
                group.add(foliage2);
                
                group.position.set(x, 0, z);
                return group;
            }
            
            const treePositions = [
                [-28, -28], [-25, -30], [-22, -29], [-30, -22], [-32, -25],
                [28, -28], [25, -30], [22, -29], [30, -22], [32, -25],
                [-28, 28], [-25, 30], [-22, 29], [-30, 22], [-32, 25],
                [28, 28], [25, 30], [22, 29], [30, 22], [32, 25]
            ];
            
            treePositions.forEach(pos => {
                scene.add(createTree(pos[0], pos[1]));
            });
            
            // ============ BUILDINGS ============
            buildingsData.forEach(b => {
                const group = new THREE.Group();
                let height = 2.2;
                if (b.id === 'dream') height = 3.5;
                if (b.id === 'office') height = 2.8;
                if (b.id === 'techpark') height = 2.5;
                
                const wallMat = new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.3, metalness: 0.4 });
                const walls = new THREE.Mesh(new THREE.BoxGeometry(1.8, height, 1.8), wallMat);
                walls.position.y = height / 2;
                walls.castShadow = true;
                walls.receiveShadow = true;
                group.add(walls);
                
                // Windows
                const windowMat = new THREE.MeshStandardMaterial({ color: 0xffaa77, emissive: 0xff8844, emissiveIntensity: 0.3 });
                for (let i = -0.5; i <= 0.5; i += 0.5) {
                    for (let j = 0.7; j <= height - 0.5; j += 0.7) {
                        const windowBox = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.05), windowMat);
                        windowBox.position.set(i, j, 0.95);
                        windowBox.castShadow = true;
                        group.add(windowBox);
                        
                        const windowBoxBack = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.05), windowMat);
                        windowBoxBack.position.set(i, j, -0.95);
                        windowBoxBack.castShadow = true;
                        group.add(windowBoxBack);
                    }
                }
                
                // Roof
                const roofMat = new THREE.MeshStandardMaterial({ color: 0xaa8866 });
                const roof = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.2, 0.2, 4), roofMat);
                roof.position.y = height;
                roof.castShadow = true;
                group.add(roof);
                
                group.position.set(b.pos.x, 0, b.pos.z);
                scene.add(group);
            });
            
            // ============ PLAYER CAR ============
            const carGroup = new THREE.Group();
            
            const carBodyMat = new THREE.MeshStandardMaterial({ color: 0x00d4ff, metalness: 0.8, roughness: 0.2 });
            const carBodyMain = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 1.5), carBodyMat);
            carBodyMain.position.y = 0.2;
            carBodyMain.castShadow = true;
            carGroup.add(carBodyMain);
            
            const carRoofMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const carRoofMain = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.35, 0.95), carRoofMat);
            carRoofMain.position.y = 0.55;
            carRoofMain.castShadow = true;
            carGroup.add(carRoofMain);
            
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7 });
            const wheelPos = [[-0.6, 0.15, -0.65], [0.6, 0.15, -0.65], [-0.6, 0.15, 0.65], [0.6, 0.15, 0.65]];
            wheelPos.forEach(pos => {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.15, 16), wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });
            
            scene.add(carGroup);
            
            // ============ NPC CARS ============
            function createSimpleCar(color, x, z) {
                const group = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.6 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 1.2), bodyMat);
                body.position.y = 0.2;
                body.castShadow = true;
                group.add(body);
                
                const roofMatN = new THREE.MeshStandardMaterial({ color: 0x444444 });
                const roof = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.8), roofMatN);
                roof.position.y = 0.55;
                roof.castShadow = true;
                group.add(roof);
