<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AP City 3D — Drive. Explore. Discover My Work.</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Exo 2', sans-serif;
            overflow: hidden;
            color: #fff;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(5, 5, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
        }
        
        .ap-badge {
            background: linear-gradient(135deg, #00d4ff, #b04fff);
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 900;
            display: inline-block;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        
        .name {
            font-size: 18px;
            font-weight: 700;
            color: #00d4ff;
            letter-spacing: 2px;
        }
        
        .tagline {
            font-size: 10px;
            color: rgba(0, 212, 255, 0.6);
            letter-spacing: 1px;
            margin-top: 4px;
        }
        
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(5, 5, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 11px;
            font-family: 'Orbitron', monospace;
            pointer-events: none;
        }
        
        .controls-key {
            display: inline-block;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 6px;
            padding: 4px 8px;
            margin: 0 2px;
            font-size: 11px;
        }
        
        #building-indicator {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #00ff88;
            border-radius: 12px;
            padding: 12px 24px;
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
        }
        
        #building-indicator.visible {
            opacity: 1;
        }
        
        .building-name {
            color: #00ff88;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        
        .building-hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }
        
        #progress-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(5, 5, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            min-width: 160px;
            text-align: center;
            font-family: 'Orbitron', monospace;
        }
        
        .progress-label {
            font-size: 9px;
            color: rgba(0, 212, 255, 0.6);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 8px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #b04fff, #ff3da6);
            width: 0%;
            transition: width 0.5s;
            border-radius: 2px;
        }
        
        .progress-text {
            font-size: 10px;
            color: #00d4ff;
        }
        
        #achievement-toast {
            position: absolute;
            bottom: 120px;
            right: 20px;
            background: rgba(5, 5, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #ffb700;
            border-radius: 12px;
            padding: 12px 20px;
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
            min-width: 220px;
            font-family: 'Orbitron', monospace;
        }
        
        #achievement-toast.show {
            transform: translateX(0);
        }
        
        .ach-title {
            font-size: 9px;
            color: #ffb700;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        
        .ach-name {
            font-size: 12px;
            color: #fff;
        }
        
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        #modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: linear-gradient(145deg, #080818, #0d1228);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 20px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        #modal-overlay.open .modal-content {
            transform: scale(1);
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #fff;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: rgba(255, 0, 0, 0.3);
            border-color: rgba(255, 0, 0, 0.5);
        }
        
        .modal-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 12px;
        }
        
        .modal-title {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 6px;
        }
        
        .modal-subtitle {
            font-size: 11px;
            text-align: center;
            color: rgba(0, 212, 255, 0.6);
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        
        .modal-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            margin: 20px 0;
        }
        
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        
        .sec-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px;
            transition: all 0.2s;
        }
        
        .sec-card:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }
        
        .sec-card h4 {
            font-size: 13px;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        
        .sec-card p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }
        
        .skill-item {
            margin-bottom: 12px;
        }
        
        .skill-name {
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .skill-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .skill-fill {
            height: 100%;
            border-radius: 2px;
            width: 0;
            transition: width 1s;
        }
        
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 9px;
            border: 1px solid;
            margin: 2px;
        }
        
        .exp-item {
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid;
            border-radius: 0 8px 8px 0;
            margin-bottom: 12px;
        }
        
        .exp-item h4 {
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .exp-item p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .exp-role {
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 12px;
            margin-bottom: 10px;
            outline: none;
        }
        
        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #ff6b35;
        }
        
        .contact-form textarea {
            height: 70px;
            resize: none;
        }
        
        .contact-btn {
            background: linear-gradient(135deg, #ff6b35, #ff3da6);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        
        .dream-item {
            padding: 10px;
            background: rgba(255, 183, 0, 0.05);
            border: 1px solid rgba(255, 183, 0, 0.15);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .dream-item h4 {
            font-size: 12px;
            color: #ffb700;
        }
        
        .dream-item p {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        @media (max-width: 600px) {
            #info { font-size: 10px; padding: 8px 12px; }
            .name { font-size: 14px; }
            #progress-panel { padding: 8px 12px; min-width: 120px; }
            .modal-content { padding: 20px; }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .blink {
            animation: blink 1s ease-in-out infinite;
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="info">
        <div class="ap-badge">AP</div>
        <div class="name">ARYAN PARMAR</div>
        <div class="tagline">AUTOMATION · OPERATIONS · DIGITAL MARKETING</div>
    </div>
    
    <div id="progress-panel">
        <div class="progress-label">CITY EXPLORED</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0 / 8 BUILDINGS</div>
    </div>
    
    <div id="building-indicator">
        <div class="building-name" id="building-name">BUILDING</div>
        <div class="building-hint">Press E to explore</div>
    </div>
    
    <div id="controls-panel">
        <span class="controls-key">W A S D</span> or 
        <span class="controls-key">← ↑ ↓ →</span> to drive<br>
        <span class="controls-key">E</span> to enter building • 
        <span class="controls-key">ESC</span> to close
    </div>
    
    <div id="achievement-toast">
        <div class="ach-title">🏆 ACHIEVEMENT UNLOCKED</div>
        <div class="ach-name" id="achievement-name">City Explorer!</div>
    </div>
    
    <div id="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">✕</button>
            <div id="modal-inner"></div>
        </div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        
        // ============ BUILDING DATA (same as 2D version) ============
        const buildingsData = [
            { id: 'house', label: '🏠 HOUSE', sublabel: 'About Me', pos: { x: -12, z: -18 }, color: 0x00d4ff, section: 'house', achievement: 'Welcome to AP City! 🏠' },
            { id: 'office', label: '🏢 OFFICE', sublabel: 'Experience', pos: { x: 8, z: -16 }, color: 0xb04fff, section: 'office', achievement: 'Clocking In! 🏢' },
            { id: 'garage', label: '🔧 GARAGE', sublabel: 'Skills', pos: { x: -18, z: -2 }, color: 0x00ff88, section: 'garage', achievement: 'My Garage — Powered Up! ⚙️' },
            { id: 'techpark', label: '💻 TECH PARK', sublabel: 'Projects', pos: { x: 10, z: -1 }, color: 0x00ffd4, section: 'techpark', achievement: 'Code Deployed! 💻' },
            { id: 'stadium', label: '🏟️ STADIUM', sublabel: 'Events', pos: { x: -14, z: 12 }, color: 0xff3da6, section: 'stadium', achievement: 'Crowd Goes Wild! 🎤' },
            { id: 'cafe', label: '☕ CAFÉ', sublabel: 'Contact Me', pos: { x: 6, z: 14 }, color: 0xff6b35, section: 'cafe', achievement: "Let's Meet! ☕" },
            { id: 'secret', label: '? HIDDEN', sublabel: 'Achievements', pos: { x: -24, z: -12 }, color: 0xff0055, section: 'secret', achievement: '🕵️ Secret Agent — Found It!' },
            { id: 'dream', label: '🌟 DREAM TOWER', sublabel: 'Future Goals', pos: { x: 16, z: 8 }, color: 0xffb700, section: 'dream', achievement: 'Dreams Are Loading... 🌟' }
        ];
        
        const visitedBuildings = new Set();
        let currentBuilding = null;
        let achievementQueue = [];
        
        // ============ SCENE SETUP ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.008);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // ============ LIGHTING ============
        // Ambient light
        const ambientLight = new THREE.AmbientLight(0x1a1a2e);
        scene.add(ambientLight);
        
        // Main directional light (sun)
        const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
        sunLight.position.set(20, 30, 10);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -20;
        sunLight.shadow.camera.right = 20;
        sunLight.shadow.camera.top = 20;
        sunLight.shadow.camera.bottom = -20;
        scene.add(sunLight);
        
        // Fill light from below
        const fillLight = new THREE.PointLight(0x445566, 0.3);
        fillLight.position.set(0, -5, 0);
        scene.add(fillLight);
        
        // Back rim light
        const rimLight = new THREE.PointLight(0x00d4ff, 0.4);
        rimLight.position.set(-5, 5, -8);
        scene.add(rimLight);
        
        // Colored accent lights
        const accentColors = [0x00d4ff, 0xb04fff, 0xff3da6];
        for (let i = 0; i < 6; i++) {
            const light = new THREE.PointLight(accentColors[i % accentColors.length], 0.25);
            light.position.set(Math.sin(i) * 15, 3, Math.cos(i) * 15);
            scene.add(light);
        }
        
        // ============ GROUND ============
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0a18, roughness: 0.7, metalness: 0.1 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Grid helper (roads)
        const gridHelper = new THREE.GridHelper(90, 30, 0x00d4ff, 0x2a2a3a);
        gridHelper.position.y = -0.05;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        // Road markings (glowing lines)
        const roadMat = new THREE.MeshStandardMaterial({ color: 0xffb700, emissive: 0xff4400, emissiveIntensity: 0.3 });
        for (let i = -35; i <= 35; i += 5) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.5), roadMat);
            line.position.set(i, -0.02, 0);
            line.castShadow = false;
            scene.add(line);
            
            const line2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.5), roadMat);
            line2.position.set(0, -0.02, i);
            line2.castShadow = false;
            scene.add(line2);
        }
        
        // ============ TREES ============
        function createTree(x, z) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5d3a1a, roughness: 0.8 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 1.2, 6), trunkMat);
            trunk.position.y = 0.6;
            trunk.castShadow = true;
            group.add(trunk);
            
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x2a6b2a, emissive: 0x116611, emissiveIntensity: 0.1 });
            const foliage1 = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.2, 8), foliageMat);
            foliage1.position.y = 1.2;
            foliage1.castShadow = true;
            group.add(foliage1);
            
            const foliage2 = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.0, 8), foliageMat);
            foliage2.position.y = 2.0;
            foliage2.castShadow = true;
            group.add(foliage2);
            
            group.position.set(x, 0, z);
            return group;
        }
        
        const treePositions = [
            [-28, -28], [-25, -30], [-22, -29], [-30, -22], [-32, -25],
            [28, -28], [25, -30], [22, -29], [30, -22], [32, -25],
            [-28, 28], [-25, 30], [-22, 29], [-30, 22], [-32, 25],
            [28, 28], [25, 30], [22, 29], [30, 22], [32, 25],
            [-18, -32], [18, -32], [-18, 32], [18, 32]
        ];
        
        treePositions.forEach(pos => {
            scene.add(createTree(pos[0], pos[1]));
        });
        
        // ============ STREET LAMPS ============
        function createStreetLamp(x, z) {
            const group = new THREE.Group();
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x556677, metalness: 0.7, roughness: 0.3 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2.5, 6), poleMat);
            pole.position.y = 1.25;
            pole.castShadow = true;
            group.add(pole);
            
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.8), poleMat);
            arm.position.set(0.5, 2.3, 0);
            arm.castShadow = true;
            group.add(arm);
            
            const lampMat = new THREE.MeshStandardMaterial({ color: 0xffcc88, emissive: 0xffaa66, emissiveIntensity: 0.5 });
            const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), lampMat);
            lamp.position.set(0.85, 2.3, 0);
            lamp.castShadow = true;
            group.add(lamp);
            
            group.position.set(x, 0, z);
            return group;
        }
        
        const lampPositions = [
            [-15, -15], [15, -15], [-15, 15], [15, 15],
            [-22, -8], [-22, 8], [22, -8], [22, 8],
            [-8, -22], [8, -22], [-8, 22], [8, 22]
        ];
        
        lampPositions.forEach(pos => {
            scene.add(createStreetLamp(pos[0], pos[1]));
        });
        
        // ============ BUILDINGS ============
        const buildingMeshes = {};
        
        buildingsData.forEach(b => {
            const group = new THREE.Group();
            const width = 1.8;
            const depth = 1.8;
            let height = 2.2;
            
            if (b.id === 'dream') height = 3.2;
            if (b.id === 'office') height = 2.8;
            if (b.id === 'techpark') height = 2.5;
            if (b.id === 'stadium') height = 2.0;
            
            const wallMat = new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.3, metalness: 0.4, emissive: b.color, emissiveIntensity: 0.1 });
            const walls = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), wallMat);
            walls.position.y = height / 2;
            walls.castShadow = true;
            walls.receiveShadow = true;
            group.add(walls);
            
            // Windows
            const windowMat = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xffaa44, emissiveIntensity: 0.3 });
            for (let i = -0.6; i <= 0.6; i += 0.6) {
                for (let j = 0.8; j <= height - 0.5; j += 0.7) {
                    const windowBox = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.05), windowMat);
                    windowBox.position.set(i, j, depth / 2 + 0.05);
                    windowBox.castShadow = true;
                    group.add(windowBox);
                    
                    const windowBoxBack = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.05), windowMat);
                    windowBoxBack.position.set(i, j, -depth / 2 - 0.05);
                    windowBoxBack.castShadow = true;
                    group.add(windowBoxBack);
                }
            }
            
            // Roof
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xcc8866, roughness: 0.8 });
            const roof = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.2, 0.25, 4), roofMat);
            roof.position.y = height;
            roof.castShadow = true;
            group.add(roof);
            
            // Roof ornament (glowing)
            const ornamentMat = new THREE.MeshStandardMaterial({ color: b.color, emissive: b.color, emissiveIntensity: 0.4 });
            const ornament = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), ornamentMat);
            ornament.position.y = height + 0.2;
            group.add(ornament);
            
            group.position.set(b.pos.x, 0, b.pos.z);
            scene.add(group);
            
            buildingMeshes[b.id] = {
                mesh: group,
                data: b,
                position: new THREE.Vector3(b.pos.x, 0, b.pos.z)
            };
            
            // Add floating label
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'Bold 20px "Orbitron"';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(b.label, canvas.width/2, 30);
            ctx.font = '12px "Exo 2"';
            ctx.fillStyle = '#aaaaff';
            ctx.fillText(b.sublabel, canvas.width/2, 55);
            
            const texture = new THREE.CanvasTexture(canvas);
            const labelMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(labelMat);
            sprite.scale.set(1.5, 0.75, 1);
            sprite.position.set(b.pos.x, height + 0.6, b.pos.z);
            scene.add(sprite);
            buildingMeshes[b.id].sprite = sprite;
        });
        
        // ============ NPC CARS (moving around) ============
        const npcCars = [];
        const carColors = [0x00d4ff, 0xb04fff, 0xff3da6, 0x00ff88, 0xff6b35, 0xffb700];
        
        function createNPCCar(color, x, z) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.3 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 1.2), bodyMat);
            body.position.y = 0.2;
            body.castShadow = true;
            group.add(body);
            
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const roof = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.8), roofMat);
            roof.position.y = 0.55;
            roof.castShadow = true;
            group.add(roof);
            
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
            const wheelPos = [[-0.5, 0.1, -0.5], [0.5, 0.1, -0.5], [-0.5, 0.1, 0.5], [0.5, 0.1, 0.5]];
            wheelPos.forEach(pos => {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.15, 16), wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                group.add(wheel);
            });
            
            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }
        
        for (let i = 0; i < 12; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 18 + Math.random() * 12;
            npcCars.push({
                mesh: createNPCCar(carColors[i % carColors.length], Math.cos(angle) * radius, Math.sin(angle) * radius),
                angle: angle,
                radius: radius,
                speed: 0.005 + Math.random() * 0.008,
                height: 0
            });
        }
        
        // ============ PEDESTRIANS (floating orbs) ============
        const pedestrians = [];
        for (let i = 0; i < 30; i++) {
            const color = new THREE.Color().setHSL(Math.random(), 0.7, 0.6);
            const orbMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.2 });
            const orb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), orbMat);
            const x = (Math.random() - 0.5) * 40;
            const z = (Math.random() - 0.5) * 40;
            orb.position.set(x, 0.2, z);
            orb.castShadow = true;
            scene.add(orb);
            pedestrians.push({
                mesh: orb,
                x: x,
                z: z,
                dx: (Math.random() - 0.5) * 0.02,
                dz: (Math.random() - 0.5) * 0.02
            });
        }
        
        // ============ CAR ============
        const carGroup = new THREE.Group();
        
        const carBodyMat = new THREE.MeshStandardMaterial({ color: 0x00d4ff, metalness: 0.8, roughness: 0.2, emissive: 0x00aaff, emissiveIntensity: 0.15 });
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 1.4), carBodyMat);
        carBody.position.y = 0.2;
        carBody.castShadow = true;
        carGroup.add(carBody);
        
        const carRoofMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const carRoof = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.35, 0.9), carRoofMat);
        carRoof.position.y = 0.55;
        carRoof.castShadow = true;
        carGroup.add(carRoof);
        
        const carWindowMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x4488ff, emissiveIntensity: 0.2 });
        const carWindow = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.2, 0.7), carWindowMat);
        carWindow.position.y = 0.7;
        carWindow.castShadow = true;
        carGroup.add(carWindow);
        
        const wheelMatCar = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9 });
        const wheelPositions = [[-0.6, 0.1, -0.6], [0.6, 0.1, -0.6], [-0.6, 0.1, 0.6], [0.6, 0.1, 0.6]];
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.18, 16), wheelMatCar);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(pos[0], pos[1], pos[2]);
            wheel.castShadow = true;
            carGroup.add(wheel);
        });
        
        const lightMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0xff0000, emissiveIntensity: 0.5 });
        const frontLight = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), lightMat);
        frontLight.position.set(0.5, 0.2, 0.75);
        carGroup.add(frontLight);
        
        const frontLightL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), lightMat);
        frontLightL.position.set(-0.5, 0.2, 0.75);
        carGroup.add(frontLightL);
        
        const backLightMat = new THREE.MeshStandardMaterial({ color: 0xff6666, emissive: 0xff3333, emissiveIntensity: 0.3 });
        const backLight = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), backLightMat);
        backLight.position.set(0.5, 0.2, -0.75);
        carGroup.add(backLight);
        
        const backLightL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), backLightMat);
        backLightL.position.set(-0.5, 0.2, -0.75);
        carGroup.add(backLightL);
        
        scene.add(carGroup);
        
        // ============ CAR CONTROLS ============
        const keys = { w: false, s: false, a: false, d: false };
        let carSpeed = 0;
        let carAngle = 0;
        const maxSpeed = 12;
        const acceleration = 0.35;
        const friction = 0.96;
        const turnSpeed = 0.045;
        
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true;
            if (key === 's') keys.s = true;
            if (key === 'a') keys.a = true;
            if (key === 'd') keys.d = true;
            if (key === 'e' && currentBuilding) {
                openBuilding(currentBuilding);
            }
            if (key === 'escape') {
                document.getElementById('modal-overlay').classList.remove('open');
            }
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 's', 'a', 'd'].includes(key)) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 's') keys.s = false;
            if (key === 'a') keys.a = false;
            if (key === 'd') keys.d = false;
        });
        
        // ============ CAMERA FOLLOW ============
        let cameraOffset = new THREE.Vector3(0, 2.8, 6);
        let cameraLookOffset = new THREE.Vector3(0, 0.5, 0);
        
        // ============ BUILDING PROXIMITY CHECK ============
        function checkBuildingProximity() {
            let closest = null;
            let closestDist = Infinity;
            
            buildingsData.forEach(b => {
                const dx = carGroup.position.x - b.pos.x;
                const dz = carGroup.position.z - b.pos.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < 2.5 && dist < closestDist) {
                    closestDist = dist;
                    closest = b;
                }
            });
            
            const indicator = document.getElementById('building-indicator');
            const buildingNameSpan = document.getElementById('building-name');
            
            if (closest !== currentBuilding) {
                currentBuilding = closest;
                if (closest) {
                    indicator.classList.add('visible');
                    buildingNameSpan.textContent = closest.label;
                } else {
                    indicator.classList.remove('visible');
                }
            }
        }
        
        // ============ ACHIEVEMENT SYSTEM ============
        function showAchievement(text) {
            achievementQueue.push(text);
            if (achievementQueue.length === 1) processAchievement();
        }
        
        function processAchievement() {
            if (!achievementQueue.length) return;
            const toast = document.getElementById('achievement-toast');
            document.getElementById('achievement-name').textContent = achievementQueue[0];
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                achievementQueue.shift();
                setTimeout(processAchievement, 500);
            }, 3200);
        }
        
        function updateProgress() {
            const pct = (visitedBuildings.size / buildingsData.length) * 100;
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('progress-text').textContent = `${visitedBuildings.size} / ${buildingsData.length} BUILDINGS`;
            if (visitedBuildings.size === buildingsData.length) {
                showAchievement('🏆 Full City Explorer — AP City Conquered!');
            }
        }
        
        // ============ BUILDING CONTENT (same as 2D version) ============
        const buildingContent = {
            house: { icon: '🏠', title: 'THE STORY BEHIND THE DRIVER', subtitle: 'About Aryan Parmar', color: '#00d4ff', content: `
                <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px">
                    <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#b04fff);display:flex;align-items:center;justify-content:center;font-size:36px;">👨‍💻</div>
                    <div style="flex:1"><div style="font-family:Orbitron;font-size:20px;font-weight:900;color:#00d4ff">ARYAN PARMAR</div><div style="font-size:11px;color:rgba(0,212,255,0.55)">MUMBAI, INDIA</div><p style="font-size:12px;margin-top:8px">Operations professional and automation builder who turns manual chaos into streamlined systems.</p></div>
                </div>
                <div class="section-grid">
                    <div class="sec-card"><h4>🏫 Schooling</h4><p>St. Xavier's High School</p></div>
                    <div class="sec-card"><h4>🎓 Graduation</h4><p>Tolani College of Commerce</p></div>
                    <div class="sec-card"><h4>📱 Leadership</h4><p>Head of Social Media - College Fest</p></div>
                </div>
                <div class="modal-divider"></div>
                <p style="font-size:12px;color:rgba(0,212,255,0.48);text-align:center;font-style:italic">"This city is my story. Every building is a chapter."</p>
            `},
            office: { icon: '🏢', title: "PLACES I'VE WORKED", subtitle: 'My City of Experience', color: '#b04fff', content: `
                <div class="exp-item" style="border-left-color:#b04fff"><div class="exp-role" style="color:#b04fff">Current · Andromeda Sales & Distribution</div><h4>Customer Service & Operations</h4><p>Handling customer service operations, tech processes, app testing, and internal automation.</p></div>
                <div class="exp-item" style="border-left-color:#ff3da6"><div class="exp-role" style="color:#ff3da6">Freelance · BookMyShow Events</div><h4>Event Operations Freelancer</h4><p>Worked on-ground operations for Lollapalooza, IPL 2024, Aaditya Gadhvi, Fintech @ Jio Centre.</p></div>
                <div class="exp-item" style="border-left-color:#ffb700"><div class="exp-role" style="color:#ffb700">Leadership · Tolani College</div><h4>Head of Social Media — Intra College Fest</h4><p>Led social media strategy for 30,000+ audience reach.</p></div>
            `},
            garage: { icon: '🔧', title: 'MY GARAGE', subtitle: 'Skills That Power The Car', color: '#00ff88', content: `
                <div class="skill-item"><div class="skill-name"><span>Python Automation</span><span>90%</span></div><div class="skill-track"><div class="skill-fill" style="background:#00d4ff;width:90%"></div></div></div>
                <div class="skill-item"><div class="skill-name"><span>Excel Automation</span><span>93%</span></div><div class="skill-track"><div class="skill-fill" style="background:#00ff88;width:93%"></div></div></div>
                <div class="skill-item"><div class="skill-name"><span>Operations Mgmt</span><span>88%</span></div><div class="skill-track"><div class="skill-fill" style="background:#ff6b35;width:88%"></div></div></div>
                <div class="skill-item"><div class="skill-name"><span>Digital Marketing</span><span>82%</span></div><div class="skill-track"><div class="skill-fill" style="background:#b04fff;width:82%"></div></div></div>
                <div class="modal-divider"></div>
                <div>${['Python','Excel','WhatsApp API','Power BI','Canva','Zapier','GitHub'].map(t => `<span class="tag" style="color:#00ff88;border-color:rgba(0,255,136,0.3)">${t}</span>`).join('')}</div>
            `},
            techpark: { icon: '💻', title: 'PROJECTS I BUILT', subtitle: 'That Solve Real Problems', color: '#00ffd4', content: `
                <div class="sec-card"><h4>📱 Business WhatsApp Automation Tool</h4><p>Bulk WhatsApp messaging system with Excel integration.</p></div>
                <div class="sec-card"><h4>📊 Excel Report Automation System</h4><p>Smart Excel file generator that eliminates hours of manual work.</p></div>
                <div class="sec-card"><h4>🤖 AI Assistant That Listens & Remembers</h4><p>Desktop voice assistant with memory and speech interaction.</p></div>
                <div class="sec-card"><h4>📧 Automated Email Sender for Operations</h4><p>Bulk email automation system with one-click sending.</p></div>
            `},
            stadium: { icon: '🏟️', title: 'STADIUM — EVENTS', subtitle: "Live Experiences I've Been Part Of", color: '#ff3da6', content: `
                <div class="sec-card"><h4>🎸 Lollapalooza India</h4><p>Event Ops Freelancer · BookMyShow</p></div>
                <div class="sec-card"><h4>🏏 IPL 2024</h4><p>Match-day operations at the biggest cricket league</p></div>
                <div class="sec-card"><h4>💳 Fintech Event — Jio Convention Centre</h4><p>Large-scale B2B fintech conference operations</p></div>
            `},
            cafe: { icon: '☕', title: "LET'S MEET AT THE CAFÉ", subtitle: "Let's Connect", color: '#ff6b35', content: `
                <div class="contact-form">
                    <input type="text" placeholder="Your Name">
                    <input type="email" placeholder="Your Email">
                    <textarea placeholder="What's on your mind?"></textarea>
                    <button class="contact-btn" onclick="alert('Message sent! Aryan will get back to you.')">SEND MESSAGE →</button>
                </div>
            `},
            secret: { icon: '🕵️', title: 'HIDDEN ACHIEVEMENTS', subtitle: 'You Found The Secret', color: '#ff0055', content: `
                <ul style="list-style:none;padding:0">
                    <li style="padding:8px;background:rgba(255,0,85,0.1);margin:5px 0;border-radius:8px">🎸 Managed digital engagement for 30,000+ users as Head of Social Media</li>
                    <li style="padding:8px;background:rgba(255,0,85,0.1);margin:5px 0;border-radius:8px">🤖 Built WhatsApp automation bots that send bulk personalised messages</li>
                    <li style="padding:8px;background:rgba(255,0,85,0.1);margin:5px 0;border-radius:8px">🎙️ Built a voice AI assistant with memory from scratch in Python</li>
                    <li style="padding:8px;background:rgba(255,0,85,0.1);margin:5px 0;border-radius:8px">🏙️ This entire 3D city was built from scratch!</li>
                </ul>
            `},
            dream: { icon: '🌟', title: 'DREAM TOWER', subtitle: "Future Goals", color: '#ffb700', content: `
                <div class="dream-item"><h4>🤖 Full Automation Agency</h4><p>Help small businesses automate repetitive work</p></div>
                <div class="dream-item"><h4>🌐 SaaS WhatsApp CRM Tool</h4><p>A real product for small business owners</p></div>
                <div class="dream-item"><h4>🎓 Advanced Python & AI Skills</h4><p>Level up into machine learning and AI-powered automation</p></div>
                <div class="dream-item"><h4>🚀 Lead a Tech + Ops Team</h4><p>Build digital systems and products end-to-end</p></div>
            `}
        };
        
        function openBuilding(building) {
            if (!building) return;
            if (!visitedBuildings.has(building.id)) {
                visitedBuildings.add(building.id);
                updateProgress();
                showAchievement(building.achievement);
            }
            const content = buildingContent[building.section];
            if (!content) return;
            
            document.getElementById('modal-inner').innerHTML = `
                <div style="text-align:center">
                    <div class="modal-icon">${content.icon}</div>
                    <div class="modal-title" style="color:${content.color}">${content.title}</div>
                    <div class="modal-subtitle">${content.subtitle}</div>
                </div>
                <div class="modal-divider"></div>
                ${content.content}
            `;
            document.getElementById('modal-overlay').classList.add('open');
        }
        
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal-overlay').classList.remove('open');
        });
        
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal-overlay')) {
                document.getElementById('modal-overlay').classList.remove('open');
            }
        });
        
        // ============ ANIMATION LOOP ============
        let time = 0;
        
        function animate() {
            time += 0.016;
            
            // Car movement
            if (keys.w) carSpeed += acceleration;
            if (keys.s) carSpeed -= acceleration * 0.6;
            carSpeed *= friction;
            carSpeed = Math.max(-maxSpeed * 0.5, Math.min(maxSpeed, carSpeed));
            
            if (keys.a && Math.abs(carSpeed) > 0.3) carAngle += turnSpeed * (carSpeed > 0 ? 1 : 0.5);
            if (keys.d && Math.abs(carSpeed) > 0.3) carAngle -= turnSpeed * (carSpeed > 0 ? 1 : 0.5);
            
            // Update car position
            carGroup.position.x += Math.sin(carAngle) * carSpeed * 0.12;
            carGroup.position.z += Math.cos(carAngle) * carSpeed * 0.12;
            carGroup.rotation.y = carAngle;
            
            // Boundaries
            const bound = 32;
            carGroup.position.x = Math.max(-bound, Math.min(bound, carGroup.position.x));
            carGroup.position.z = Math.max(-bound, Math.min(bound, carGroup.position.z));
            
            // Wheel rotation effect
            carGroup.children.forEach(child => {
                if (child.geometry && child.geometry.type === 'CylinderGeometry') {
                    child.rotation.x += carSpeed * 0.15;
                }
            });
            
            // Camera follow
            const targetPosition = carGroup.position.clone().add(cameraOffset);
            camera.position.lerp(targetPosition, 0.08);
            const targetLook = carGroup.position.clone().add(cameraLookOffset);
            camera.lookAt(targetLook);
            
            // Animate NPC cars
            npcCars.forEach(car => {
                car.angle += car.speed;
                car.mesh.position.x = Math.cos(car.angle) * car.radius;
                car.mesh.position.z = Math.sin(car.angle) * car.radius;
                car.mesh.rotation.y = car.angle + Math.PI / 2;
            });
            
            // Animate pedestrians
            pedestrians.forEach(p => {
                p.x += p.dx;
                p.z += p.dz;
                if (Math.abs(p.x) > 35) p.dx *= -1;
                if (Math.abs(p.z) > 35) p.dz *= -1;
                p.mesh.position.x = p.x;
                p.mesh.position.z = p.z;
                p.mesh.position.y = 0.2 + Math.sin(time * 3 + p.x * 2) * 0.05;
            });
            
            // Animate building ornaments (floating effect)
            Object.values(buildingMeshes).forEach(b => {
                if (b.mesh.children.length > 0) {
                    const ornament = b.mesh.children.find(c => c.geometry && c.geometry.type === 'SphereGeometry');
                    if (ornament) {
                        ornament.position.y = (b.data.id === 'dream' ? 3.5 : 2.4) + Math.sin(time * 3) * 0.05;
                    }
                }
                if (b.sprite) {
                    b.sprite.material.rotation += 0.005;
                }
            });
            
            // Update building indicator
            checkBuildingProximity();
            
            // Pulsing rim light
            rimLight.intensity = 0.4 + Math.sin(time * 3) * 0.15;
            
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
        
        // Show welcome achievement
        setTimeout(() => {
            showAchievement('🚗 Welcome to AP City 3D — Drive. Explore. Discover!');
        }, 500);
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Add some stars in the sky
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 400;
            starPositions[i*3+1] = (Math.random() - 0.5) * 100 + 30;
            starPositions[i*3+2] = (Math.random() - 0.5) * 150 - 80;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeometry, starMat);
        scene.add(stars);
        
        // Rotate stars slowly
        function animateStars() {
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            requestAnimationFrame(animateStars);
        }
        animateStars();
        
        console.log('AP City 3D — Ready to drive!');
    </script>
